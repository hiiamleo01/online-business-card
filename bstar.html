<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#240851">
  <meta name="description" content="博星 BSTAR · 尊贵尽在眼前。探索实体场馆、多元游戏与精选礼遇。">
  <title>博星 BSTAR · 尊贵尽在眼前</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="assets/hero-poster.jpg">
  <!-- All page styles are included here. -->
  <style>
    :root {
      color-scheme: light;
      --page-width: 430px;
      --ink: #14275b;
      --gold: #e8b84a;
      --purple: #7100ce;
      --ease: cubic-bezier(.2, .7, .2, 1)
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 16px
    }

    body {
      margin: 0;
      background: #141020;
      background-image: radial-gradient(ellipse at 50% 0, #3e2460 0, transparent 65%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent
    }

    button,
    a {
      -webkit-touch-callout: none
    }

    button {
      font: inherit;
      cursor: pointer
    }

    button,
    a {
      touch-action: manipulation
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #34e5ff;
      outline-offset: 3px
    }

    a {
      color: inherit;
      text-decoration: none
    }

    .mobile-page {
      width: 100%;
      max-width: var(--page-width);
      margin: auto;
      background: #f3f0ff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 100px #0006
    }

    .reading-progress {
      position: fixed;
      top: 0;
      width: 100%;
      max-width: var(--page-width);
      height: 3px;
      z-index: 30;
      pointer-events: none
    }

    .reading-progress i {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #c38821, #fff5ae, #e5b34c);
      transform: scaleX(0);
      transform-origin: left
    }

    .hero {
      position: relative;
      aspect-ratio: 1500/1615;
      isolation: isolate;
      overflow: hidden;
      background: #1d1350
    }

    .hero-video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      inset: 0;
      z-index: -3
    }

    .hero-shade {
      position: absolute;
      inset: 0;
      z-index: -2;
      background: linear-gradient(0deg, #f6f1ff 0%, #efe4ffb8 8%, transparent 23%), linear-gradient(90deg, transparent 42%, #19114b22 80%)
    }

    .brand {
      position: absolute;
      top: 0;
      left: 0;
      width: 49%;
      height: 10%;
      display: flex;
      align-items: flex-start;
      padding: 6px 0 0 26px;
      background: #f8f7fb;
      border-radius: 0 0 98% 20%;
      box-shadow: 0 2px #e5b34e;
      z-index: 3
    }

    .brand img {
      width: 80px;
      height: auto;
      mix-blend-mode: multiply
    }

    .motion-toggle {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 30px;
      height: 30px;
      border: 1px solid #ffffff65;
      background: #1c103844;
      backdrop-filter: blur(12px);
      color: #fff;
      display: grid;
      place-items: center;
      border-radius: 50%;
      z-index: 4
    }

    .pause-symbol {
      width: 9px;
      height: 11px;
      border-left: 3px solid white;
      border-right: 3px solid white
    }

    .motion-toggle[aria-pressed="true"] .pause-symbol {
      width: 0;
      height: 0;
      border: 0;
      border-left: 9px solid white;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      margin-left: 2px
    }

    .hero-crown {
      position: absolute;
      width: 17%;
      right: 7%;
      top: 21%;
      transform: rotate(10deg);
      filter: drop-shadow(0 4px 6px #5b2709b3);
      animation: crown-glow 4s ease-in-out infinite
    }

    .hero-copy {
      position: absolute;
      top: 33%;
      right: 3%;
      width: 57%;
      text-align: center
    }

    .hero h1 {
      font-family: "STKaiti", "KaiTi", "Songti SC", "Noto Serif CJK SC", serif;
      font-style: italic;
      font-weight: 900;
      font-size: clamp(33px, 10.7vw, 46px);
      line-height: 1.12;
      letter-spacing: 1px;
      margin: 0 -3px;
      color: #ffd767;
      filter: drop-shadow(0 2px 0 #735219);
      text-shadow: 0 0 15px #e3a92b22
    }

    .hero h1 span {
      display: block;
      white-space: nowrap;
      background: linear-gradient(155deg, #fff7b6 10%, #ffdf7c 40%, #e3a22d 70%, #fff1a6);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent
    }

    .gold-stroke {
      height: 14px;
      border-top: 2px solid #fff2a7;
      border-radius: 50%;
      transform: rotate(-5deg);
      margin: 9px -2px 4px;
      filter: drop-shadow(0 0 4px #ffe267)
    }

    .hero-copy p {
      font-size: clamp(13px, 3.65vw, 16px);
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: .4px;
      color: white;
      text-shadow: 0 1px 7px #27115c;
      margin: 3px 0 18px
    }

    .gold-button {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 999px;
      background: linear-gradient(#c748ff, #7500cd 45%, #42008d 90%) padding-box, linear-gradient(125deg, #fff7bb, #e2a327 25%, #fff5b0 48%, #ba7709 75%, #fff2a5) border-box;
      box-shadow: inset 0 1px 1px #fff9, inset 0 -3px 5px #25003f66, 0 2px 0 #8c540d;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      letter-spacing: .5px;
      transition: transform .25s var(--ease), filter .25s, box-shadow .25s;
      min-height: 44px
    }

    .gold-button::after {
      content: "";
      position: absolute;
      inset: -60% auto -60% -60%;
      width: 30%;
      background: linear-gradient(90deg, transparent, #ffffff75, transparent);
      transform: skewX(-25deg);
      animation: button-shine 1.5s ease-in-out infinite;
      pointer-events: none
    }

    .gold-button:hover {
      filter: brightness(1.17);
      transform: translateY(-2px);
      box-shadow: inset 0 1px 1px #fff9, 0 4px 16px #7100ce50
    }

    .gold-button:active {
      transform: scale(.97)
    }

    .hero-cta {
      width: 100%;
      font-size: clamp(16px, 4.6vw, 20px);
      font-style: italic;
      height: 45px
    }

    .hero-cta span {
      font-size: 22px
    }

    .hero-wave {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 8%;
      z-index: 2
    }

    .hero-sparks {
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    .hero-sparks i {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #ffec9a;
      box-shadow: 0 0 7px 2px #ffc43b66;
      animation: sparkle 4s ease-in-out infinite
    }

    .hero-sparks i:nth-child(1) {
      left: 78%;
      top: 19%
    }

    .hero-sparks i:nth-child(2) {
      left: 54%;
      top: 63%;
      animation-delay: 1s
    }

    .hero-sparks i:nth-child(3) {
      left: 13%;
      top: 73%;
      animation-delay: 2.5s
    }

    .hero-sparks i:nth-child(4) {
      left: 88%;
      top: 68%;
      animation-delay: 1.7s
    }

    .hero-sparks i:nth-child(5) {
      left: 65%;
      top: 86%;
      animation-delay: 3s
    }

    .hero-sparks i:nth-child(6) {
      left: 41%;
      top: 12%;
      animation-delay: .8s
    }

    .art-section {
      position: relative;
      isolation: isolate;
      scroll-margin-top: 8px
    }

    .panel-art {
      display: block;
      width: 100%;
      height: auto
    }

    .art-button {
      position: absolute;
      margin: 0;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 15px;
      transition: box-shadow .3s, background .3s, backdrop-filter .3s;
      overflow: hidden
    }

    .art-button:hover {
      box-shadow: 0 0 17px #9e42ff55, inset 0 0 12px #fff8;
      background: #fff1;
      backdrop-filter: brightness(1.1)
    }

    .art-button:active {
      box-shadow: inset 0 0 18px #5819aa60;
      background: #5410a018
    }

    .feature {
      top: 75.82%;
      height: 22%;
      width: 29%;
      border-radius: 16px
    }

    .feature-one {
      left: 5.5%
    }

    .feature-two {
      left: 36.5%
    }

    .feature-three {
      left: 67.8%
    }

    .rewards .reward {
      left: 4%;
      width: 92%;
      height: 13.1%;
      border-radius: 999px
    }

    .reward-one {
      top: 41.6%
    }

    .reward-two {
      top: 56.1%
    }

    .reward-three {
      top: 71.8%
    }

    .reward-four {
      top: 87%
    }

    .reward-glint {
      position: absolute;
      right: 5.7%;
      top: 29%;
      width: 23.5%;
      height: 35%;
      overflow: hidden;
      border-radius: 50px
    }

    .reward-glint:after {
      content: "";
      position: absolute;
      width: 35%;
      height: 200%;
      top: -50%;
      left: -70%;
      background: linear-gradient(90deg, transparent, #fff9, transparent);
      transform: skewX(-25deg);
      animation: button-shine 1.5s ease-in-out infinite
    }

    .reward-two .reward-glint:after {
      animation-delay: .7s
    }

    .reward-three .reward-glint:after {
      animation-delay: 1.4s
    }

    .reward-four .reward-glint:after {
      animation-delay: 2.1s
    }

    .ambient-spark {
      position: absolute;
      color: #fff9d3;
      text-shadow: 0 0 8px #ffce2f;
      font-size: 22px;
      pointer-events: none;
      animation: sparkle 3.6s ease-in-out infinite
    }

    .spark-a {
      left: 9%;
      top: 36%
    }

    .spark-b {
      right: 10%;
      top: 54%;
      animation-delay: 1.5s;
      font-size: 15px
    }

    .spark-c {
      right: 12%;
      top: 53%;
      animation-delay: .8s
    }

    .game {
      border-radius: 22px
    }

    .game-live {
      left: 16.3%;
      top: 22.9%;
      width: 70%;
      height: 19.4%
    }

    .game-table {
      left: 15.8%;
      top: 43.9%;
      width: 35.7%;
      height: 21.9%
    }

    .game-slots {
      left: 52.6%;
      top: 43.9%;
      width: 36%;
      height: 21.9%
    }

    .game-sports {
      left: 15.8%;
      top: 66.7%;
      width: 35.7%;
      height: 22.1%
    }

    .game-fishing {
      left: 52.6%;
      top: 66.7%;
      width: 36%;
      height: 22.1%
    }

    .game:hover {
      box-shadow: 0 0 24px #d898ff8c, inset 0 0 15px #ffd96b66
    }

    .finale-cta {
      left: 6.5%;
      top: 77.2%;
      width: 87%;
      height: 10.1%;
      border-radius: 999px
    }

    .cta-shimmer {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      overflow: hidden
    }

    .cta-shimmer:after {
      content: "";
      position: absolute;
      left: -60%;
      top: -50%;
      height: 200%;
      width: 25%;
      background: linear-gradient(90deg, transparent, #fff8, transparent);
      transform: skewX(-25deg);
      animation: button-shine 1.5s ease-in-out infinite
    }

    .page-footer {
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px 106px;
      font-size: 10px;
      letter-spacing: 1px;
      color: #868298
    }

    .back-top {
      padding: 7px 0;
      border: 0;
      background: none;
      color: #65567c;
      font-size: 11px
    }

    .bottom-bar {
      position: fixed;
      z-index: 20;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--page-width);
      display: flex;
      gap: 10px;
      padding: 10px 14px max(12px, env(safe-area-inset-bottom));
      background: #fffef7e8;
      backdrop-filter: blur(18px);
      border-top: 1px solid #e8d6b3;
      box-shadow: 0 -4px 20px #34116112
    }

    .bottom-bar .gold-button {
      flex: 1;
      border-radius: 8px;
      min-height: 46px;
      font-family: "Songti SC", "STSong", serif;
      font-size: 21px
    }

    .bottom-bar .gold-button:nth-child(2):after {
      animation-delay: 1.7s
    }

    .bottom-bar svg {
      height: 22px;
      width: 22px;
      fill: none;
      stroke: #ffd85b;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .play-glyph {
      font-size: 21px;
      color: #ffd65b;
      filter: drop-shadow(0 1px #995110)
    }

    .detail-dialog {
      position: fixed;
      inset: 0;
      width: calc(100% - 32px);
      max-width: 390px;
      border: 1px solid #e2bc66;
      border-radius: 28px;
      margin: auto;
      padding: 36px 28px 28px;
      background: linear-gradient(155deg, #fffef9, #f0e7ff 70%, #e5dbff);
      box-shadow: 0 20px 100px #0c002b80;
      overflow: hidden;
      text-align: center;
      color: var(--ink)
    }

    .detail-dialog::backdrop {
      background: #100b2bb5;
      backdrop-filter: blur(7px)
    }

    .detail-dialog[open] {
      animation: dialog-in .35s var(--ease)
    }

    .dialog-close {
      position: absolute;
      right: 13px;
      top: 11px;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: #6b39950d;
      color: #54386d;
      font-size: 27px;
      line-height: 1
    }

    .dialog-kicker {
      position: relative;
      letter-spacing: 3px;
      font-size: 10px;
      color: #806293
    }

    .dialog-symbol {
      position: relative;
      font-size: 46px;
      line-height: 1;
      margin: 20px 0 12px;
      color: #cb9020;
      text-shadow: 0 2px #fff, 0 5px 20px #dab14740
    }

    .detail-dialog h2 {
      position: relative;
      font-family: "Songti SC", serif;
      font-size: 25px;
      margin: 8px 0 12px
    }

    .dialog-amount {
      font-size: 46px;
      font-style: italic;
      font-weight: 850;
      color: #8000bb;
      letter-spacing: -2px
    }

    .dialog-amount small {
      display: block;
      font-style: normal;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      color: #756087;
      margin: 3px 0
    }

    .dialog-copy {
      font-size: 15px;
      line-height: 1.85;
      margin: 16px 0;
      color: #504568;
      white-space: pre-line
    }

    .dialog-note {
      font-size: 11px;
      line-height: 1.65;
      color: #8b8095;
      margin: 10px 0 22px
    }

    .dialog-action {
      width: 100%;
      font-size: 16px;
      min-height: 46px
    }

    .dialog-orb {
      position: absolute;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, #ffedb2, transparent 65%);
      top: -135px;
      left: -80px
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: #fff7;
      transform: scale(0);
      animation: ripple-out .65s ease-out;
      pointer-events: none
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0
    }

    .skip-link {
      position: fixed;
      top: -100px;
      left: 50%;
      z-index: 50;
      background: #fff;
      padding: 12px;
      transform: translateX(-50%)
    }

    .skip-link:focus {
      top: 10px
    }

    .art-section.is-entering {
      animation: section-arrive .7s ease-out
    }

    .motion-paused *,
    .motion-paused *:before,
    .motion-paused *:after {
      animation-play-state: paused !important
    }

    .motion-paused {
      scroll-behavior: auto !important
    }

    @keyframes button-shine {

      0%,
      68% {
        left: -65%
      }

      88%,
      100% {
        left: 145%
      }
    }

    @keyframes sparkle {

      0%,
      100% {
        opacity: .15;
        transform: scale(.6)
      }

      50% {
        opacity: 1;
        transform: scale(1.1)
      }
    }

    @keyframes crown-glow {

      0%,
      100% {
        filter: drop-shadow(0 4px 6px #5b2709b3)
      }

      50% {
        filter: drop-shadow(0 3px 12px #ffc53675)
      }
    }

    @keyframes ripple-out {
      to {
        transform: scale(3);
        opacity: 0
      }
    }

    @keyframes dialog-in {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.97)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes section-arrive {
      from {
        filter: brightness(.88)
      }

      to {
        filter: brightness(1)
      }
    }

    @media(max-width:360px) {
      .brand {
        padding-left: 18px
      }

      .brand img {
        width: 67px
      }

      .hero-copy p {
        margin-bottom: 11px
      }

      .hero-cta {
        height: 39px;
        min-height: 39px
      }

      .gold-stroke {
        margin-top: 6px;
        height: 10px
      }

      .hero h1 {
        font-size: 10.7vw
      }

      .bottom-bar .gold-button {
        font-size: 18px
      }
    }

    @media(prefers-reduced-motion:reduce) {
      html {
        scroll-behavior: auto
      }

      *,
      *:before,
      *:after {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#games">跳至游戏</a>
  <main class="mobile-page" id="top">
    <div class="reading-progress" aria-hidden="true"><i></i></div>
    <section class="hero" aria-labelledby="hero-title">
      <video id="hero-video" class="hero-video" autoplay muted loop playsinline preload="auto"
        poster="assets/hero-poster.jpg" aria-label="博星女主与官方星星吉祥物动态主视觉">
        <source src="assets/hero.mp4" type="video/mp4">
      </video>
      <div class="hero-shade" aria-hidden="true"></div>
      <a class="brand" href="#top" aria-label="博星 BSTAR 首页"><img src="assets/brand.webp" alt="博星 BSTAR" width="235"
          height="102"></a>
      <button class="motion-toggle" aria-label="暂停页面动画" aria-pressed="false" title="暂停动画"><span class="pause-symbol"
          aria-hidden="true"></span></button>
      <svg class="hero-crown" viewBox="0 0 100 74" aria-hidden="true">
        <defs>
          <linearGradient id="crown-gold" x1="0" y1="0" x2=".8" y2="1">
            <stop stop-color="#fff3ac" />
            <stop offset=".28" stop-color="#ffc524" />
            <stop offset=".55" stop-color="#fff5b3" />
            <stop offset=".72" stop-color="#c87900" />
            <stop offset="1" stop-color="#ffce48" />
          </linearGradient>
        </defs>
        <path fill="url(#crown-gold)" stroke="#ffde7c" stroke-width="1.5"
          d="M15 54 7 16 29 36 34 6 52 31 72 5 77 36 96 19 86 57Z M15 58Q50 48 86 61L84 70Q50 58 17 67Z" />
        <g fill="url(#crown-gold)">
          <circle cx="7" cy="15" r="5" />
          <circle cx="34" cy="6" r="5" />
          <circle cx="72" cy="5" r="5" />
          <circle cx="96" cy="18" r="5" />
        </g>
      </svg>
      <div class="hero-copy">
        <h1 id="hero-title"><span>尊贵</span><span>尽在眼前</span></h1>
        <div class="gold-stroke" aria-hidden="true"></div>
        <p>一屏连线实体现场<br>精彩与尊享同步登场</p>
        <a class="gold-button hero-cta" href="#rewards">开启尊享体验 <span aria-hidden="true">▸</span></a>
      </div>
      <div class="hero-sparks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <svg class="hero-wave" viewBox="0 0 1500 135" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="wave-gold">
            <stop stop-color="#9f5d06" />
            <stop offset=".3" stop-color="#ffe9a3" />
            <stop offset=".6" stop-color="#c79832" />
            <stop offset="1" stop-color="#fff2b5" />
          </linearGradient>
        </defs>
        <path d="M0 5Q360 220 765 105T1500 40V135H0Z" fill="#f3efff" />
        <path d="M0 5Q360 220 765 105T1500 40" fill="none" stroke="url(#wave-gold)" stroke-width="12" />
      </svg>
    </section>

    <section class="art-section venue" id="venues" aria-labelledby="venues-title">

      <h2 id="venues-title" class="sr-only">实体场馆 尊贵汇聚</h2>

  <dialog class="detail-dialog" aria-labelledby="dialog-title">
    <div class="dialog-orb" aria-hidden="true"></div>
    <button class="dialog-close" aria-label="关闭详情">×</button>
    <div class="dialog-kicker">BSTAR · 博星</div>
    <div class="dialog-symbol" aria-hidden="true">✦</div>
    <h2 id="dialog-title"></h2>
    <div class="dialog-amount"></div>
    <p class="dialog-copy"></p>
    <p class="dialog-note"></p>
    <button class="gold-button dialog-action">继续探索 <span aria-hidden="true">▸</span></button>
  </dialog>
  <!-- Edit official destination URLs in BSTAR_CONFIG below. -->
  <script>
    /* Add the official destination URLs when available. Empty URLs keep the preview safe and local. */
    window.BSTAR_CONFIG = {
      playUrl: "",
      downloadUrl: "",
      gameUrls: { live: "", table: "", slots: "", sports: "", fishing: "" },
      promotionUrls: { welcome: "", reload: "", return: "", daily: "" }
    };

    // Page interactions
    (() => {
      const $ = (s) => document.querySelector(s);
      const config = window.BSTAR_CONFIG || {};
      const video = $('#hero-video');
      const dialog = $('.detail-dialog');
      const motionButton = $('.motion-toggle');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = reducedMotion.matches;
      let lastFocus = null;
      let dialogAction = null;

      const details = {
        'live-feature': { title: '实时连线', symbol: '◉', copy: '现场同步，精彩零距离。\n一屏连线实体现场，探索博星实时体验。', target: 'games' },
        'fair-feature': { title: '公平公正', symbol: '⚖', copy: '过程看得见，公平更安心。\n探索原设计所呈现的现场体验。', target: 'venues' },
        'verify-feature': { title: '现场可验', symbol: '◇', copy: '真实现场依据，透明可核实。\n汇聚优质实体场馆资源，呈现多元尊贵体验。', target: 'venues' },
        welcome: { title: '新客首存尊享礼', symbol: '♕', amount: '3,888U', copy: '新客首存尊享礼\n好礼连场，精彩加码。', promotion: true },
        reload: { title: '二存三存 · 续存加码', symbol: '✦', amount: '8,888U', copy: '二存三存，续存加码。\n探索博星专属礼遇。', promotion: true },
        return: { title: '逆风补贴 · 专属回馈', symbol: '✧', amount: '6,888U', copy: '逆风补贴，专属回馈。\n了解博星精选礼遇。', promotion: true },
        daily: { title: '每日打卡 · 活跃礼遇', symbol: '✓', amount: '8,888U', copy: '每日打卡，活跃礼遇。\n多重福利，精彩不停。', promotion: true },
        live: { title: '实时连线', symbol: '◉', copy: 'LIVE\n一屏连线实体现场，精彩与尊享同步登场。', game: true },
        table: { title: '棋牌游戏', symbol: '♠', copy: 'TABLE GAMES\n探索博星棋牌游戏分类。', game: true },
        slots: { title: '电子娱乐', symbol: '777', copy: 'SLOTS\n探索博星电子娱乐分类。', game: true },
        sports: { title: '体育赛事', symbol: '◉', copy: 'SPORTS\n探索博星体育赛事分类。', game: true },
        fishing: { title: '捕鱼游戏', symbol: '≈', copy: 'FISHING\n探索博星捕鱼游戏分类。', game: true }
      };

      function navigate(url) {
        if (!url) return false;
        try { const target = new URL(url); if (!['http:', 'https:'].includes(target.protocol)) return false; window.location.assign(target.href); return true; } catch { return false; }
      }
      function scrollToId(id) { document.getElementById(id)?.scrollIntoView({ behavior: paused ? 'instant' : 'smooth', block: 'start' }); }
      function openDialog(data, action) {
        lastFocus = document.activeElement;
        $('.dialog-symbol').textContent = data.symbol || '✦';
        $('#dialog-title').textContent = data.title;
        $('.dialog-amount').replaceChildren();
        if (data.amount) { const label = document.createElement('small'); label.textContent = '最高'; $('.dialog-amount').append(label, document.createTextNode(data.amount)); }
        $('.dialog-copy').textContent = data.copy || '';
        $('.dialog-note').textContent = data.note || '';
        $('.dialog-action').textContent = data.action || '继续探索 ▸';
        dialogAction = action || (() => scrollToId('games'));
        dialog.showModal(); document.body.style.overflow = 'hidden';
      }
      function closeDialog() { dialog.close(); }
      dialog.addEventListener('close', () => { document.body.style.overflow = ''; lastFocus?.focus({ preventScroll: true }); });
      $('.dialog-close').addEventListener('click', closeDialog);
      $('.dialog-action').addEventListener('click', () => { const action = dialogAction; closeDialog(); action?.(); });
      dialog.addEventListener('click', e => { if (e.target === dialog) { const r = dialog.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) closeDialog(); } });

      document.querySelectorAll('[data-detail]').forEach(button => button.addEventListener('click', () => {
        const key = button.dataset.detail, data = details[key];
        const url = data.game ? config.gameUrls?.[key] : data.promotion ? config.promotionUrls?.[key] : '';
        const note = data.promotion ? '页面展示原设计的活动信息；参与条件与具体规则以官方公布为准。' : data.game && !url ? '当前为互动预览，尚未连接正式游戏入口。' : '';
        openDialog({ ...data, note, action: url ? '查看官方详情 ▸' : '继续探索 ▸' }, () => { if (!navigate(url)) scrollToId(data.target || 'games'); });
      }));
      document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => {
        const kind = button.dataset.action;
        if (navigate(kind === 'download' ? config.downloadUrl : config.playUrl)) return;
        if (kind === 'download') openDialog({ title: '随时开启精彩', symbol: '↓', copy: '博星移动页面，打开浏览器即可体验。', note: '当前为互动预览，正式 App 下载地址待接入。', action: '继续浏览 ▸' }, () => scrollToId('top'));
        else openDialog({ title: '开启你的博星世界', symbol: '♕', copy: '实时连线 · 棋牌游戏 · 电子娱乐\n体育赛事 · 捕鱼游戏', note: '当前为互动预览，尚未连接正式游戏入口。', action: '探索多元游戏 ▸' }, () => scrollToId('games'));
      }));
      document.querySelectorAll('.gold-button,.art-button').forEach(button => button.addEventListener('pointerdown', e => {
        if (paused) return; const r = button.getBoundingClientRect(), ripple = document.createElement('span'), size = Math.min(r.width, r.height) * 2;
        ripple.className = 'ripple'; ripple.setAttribute('aria-hidden', 'true'); Object.assign(ripple.style, { width: size + 'px', height: size + 'px', left: (e.clientX - r.left - size / 2) + 'px', top: (e.clientY - r.top - size / 2) + 'px' }); button.append(ripple); setTimeout(() => ripple.remove(), 700);
      }));

      function updateMotion() {
        document.documentElement.classList.toggle('motion-paused', paused);
        motionButton.setAttribute('aria-pressed', String(paused));
        motionButton.setAttribute('aria-label', paused ? '播放页面动画' : '暂停页面动画');
        motionButton.title = paused ? '播放动画' : '暂停动画';
        if (paused) video.pause(); else video.play().catch(() => { paused = true; updateMotion(); });
      }
      motionButton.addEventListener('click', () => { paused = !paused; updateMotion(); });
      reducedMotion.addEventListener('change', e => { paused = e.matches; updateMotion(); });
      document.addEventListener('visibilitychange', () => { if (document.hidden) video.pause(); else if (!paused) video.play().catch(() => { }); });
      new IntersectionObserver(entries => { entries.forEach(entry => { if (entry.target === video) { if (entry.isIntersecting && !paused) video.play().catch(() => { }); else video.pause(); } }); }, { threshold: .05 }).observe(video);
      const observer = new IntersectionObserver(entries => entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('is-entering'); observer.unobserve(entry.target); } }), { threshold: .12 });
      document.querySelectorAll('.art-section').forEach(section => observer.observe(section));
      let scheduled = false;
      function updateProgress() { const distance = document.documentElement.scrollHeight - window.innerHeight; $('.reading-progress i').style.transform = `scaleX(${distance > 0 ? Math.min(1, window.scrollY / distance) : 0})`; scheduled = false; }
      window.addEventListener('scroll', () => { if (!scheduled) { scheduled = true; requestAnimationFrame(updateProgress); } }, { passive: true });
      window.addEventListener('resize', updateProgress);
      $('.back-top').addEventListener('click', () => scrollToId('top'));
      updateMotion(); updateProgress();
    })();

  </script>
